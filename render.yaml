# Render 배포 명세 (Infrastructure as Code)
# - 대시보드에서 직접 만들어도 되고, 이 파일을 GitHub 에 푸시하면 Blueprint 로 자동 인식
# - https://dashboard.render.com → New → Blueprint → 본 레포 선택

services:
  - type: web
    name: molit-server
    runtime: node
    plan: free
    region: singapore # 한국에서 latency 가장 낮은 무료 리전
    rootDir: . # 모노레포 루트에서 워크스페이스 install
    buildCommand: |
      npm install --include=dev
      npm --workspace server run deploy:db
      npm --workspace server run build
    startCommand: npm --workspace server run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # 대시보드에서 직접 입력 (TiDB 연결 문자열)
      - key: JWT_SECRET
        generateValue: true # Render 가 안전한 랜덤값 자동 생성
      - key: CORS_ORIGIN
        sync: false # Vercel 배포 후 그 URL 입력
      - key: LOGIN_LOCK_THRESHOLD
        value: "5"
      # ── 외부 API 키 (비밀: 값은 대시보드에서 입력, 깃엔 안 들어감) ──
      - key: ODSAY_API_KEY
        sync: false # ODsay 대중교통 통근 — 없으면 Haversine 폴백(이전 미설정으로 안 됐던 키)
      - key: KAKAO_REST_API_KEY
        sync: false # 카카오 POI 생활점수·지오코딩·자차 경로
      - key: MOLIT_SERVICE_KEY
        sync: false # 국토부 TAGO 대중교통품질·LH 청년주택·실거래
      - key: ADMIN_TOKEN
        sync: false # 관리자 미들웨어 — 관리 엔드포인트 쓸 때만(미설정 시 차단)
      # ── 비밀 아님 (인라인) ──
      - key: ODSAY_REFERER
        value: https://api.naodisalm.kr # ODsay 'URI(Service URI)' 환경 등록값과 정확히 일치시킬 것

